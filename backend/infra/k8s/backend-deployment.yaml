apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: threatlens
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/threatlens-backend:v1.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: threatlens-config
            - secretRef:
                name: threatlens-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: threatlens
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
