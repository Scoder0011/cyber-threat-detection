name: AI Models CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ai_models/requirements.txt pytest httpx
      - run: python -m compileall -q ai_models
      - run: pytest tests/test_ai_service.py -q
